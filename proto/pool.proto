syntax = "proto3";

package pool;

option go_package = "github.com/grandminingpool/pool-api-proto/v2/generated/pool;pool";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

enum PayoutMode {
    PPLNS = 0;
    PROP = 1;
}

enum AddressFormat {
    Normal = 0;
    Memo = 1;
}

enum HardwareType {
    ASIC = 0;
    GPU = 1;
}

message PayoutsInfo {
    uint32 interval = 1;
    uint64 min_payout = 2;
    optional uint64 max_payout = 3;
}

message PoolFee {
    double fee = 1;
    optional double solo_fee = 2;
}

message PoolSlave {
    string region = 1;
    string host = 2;
    uint32 tcp_port = 3;
    uint32 ssl_port = 4;
    google.protobuf.Timestamp connected_at = 5;
}

// PayoutTerms are the terms the pool pays miners on for one blockchain: the payout address format,
// the fee and the payout settings.
message PayoutTerms {
    AddressFormat address_format = 1;
    PoolFee fee = 2;
    PayoutsInfo payouts_info = 3;     // amounts in the blockchain's smallest unit
}

// BlocksStats are one blockchain's found-block counters.
message BlocksStats {
    uint32 blocks_count_24h = 1;
    optional uint64 last_found_block_height = 2;
    optional google.protobuf.Timestamp last_found_block_at = 3;
}

message PoolInfo {
    string blockchain = 1;
    string host = 3;
    repeated string algos = 4;
    PayoutMode payout_mode = 5;
    bool solo = 6;
    HardwareType hardware_type = 9;
    repeated string agents = 10;
    PayoutTerms payout_terms = 11;                     // payout terms of the primary blockchain
    // aux_payout_terms maps each aux blockchain's name (e.g. "nacre") to its payout terms; empty
    // without merged mining. Its keys are the aux blockchains the pool merge-mines, and the values
    // that requests take in blockchain.
    map<string, PayoutTerms> aux_payout_terms = 12;
}

message NetworkInfo {
    uint64 height = 1;
    uint64 block_reward = 2;
    bytes difficulty = 3;
}

message PoolSlaves {
    repeated PoolSlave slaves = 1;
}

message GetPoolAssetRequest {
    bool solo = 1;
}

message PoolStats {
    uint32 miners_count = 1;
    uint32 workers_count = 2;
    bytes hashrate = 3;
    bytes avg_hashrate = 4;
    BlocksStats blocks = 8;                            // found-block counters of the primary blockchain
    map<string, BlocksStats> aux_blocks = 9;           // aux blockchain name -> its found-block counters
}

service PoolService {
    rpc GetPoolInfo(google.protobuf.Empty) returns (PoolInfo);
    rpc GetNetworkInfo(google.protobuf.Empty) returns (NetworkInfo);
    
    rpc GetPoolSlaves(GetPoolAssetRequest) returns (PoolSlaves);
    rpc GetPoolStats(GetPoolAssetRequest) returns (PoolStats);
}